<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Simple Network Scanner</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: system-ui, Arial; max-width: 760px; margin: 2rem auto; padding: 1rem; }
    input, button { padding: 0.5rem; margin: 0.25rem 0; width: 100%; box-sizing: border-box; }
    .row { display:flex; gap:0.5rem; }
    .col { flex:1; }
    pre { background:#f6f6f6; padding:1rem; overflow:auto; white-space:pre-wrap; }
    .small { font-size:0.9rem; color:#555; }
  </style>
</head>
<body>
  <h2>Simple Network Scanner (Web UI)</h2>
  <p class="small"><strong>Warning:</strong> Only scan hosts you own or have permission to test.</p>

  <label>Host (IP or hostname)</label>
  <input id="host" placeholder="192.168.1.10 or example.com" />

  <div class="row">
    <div class="col">
      <label>Start Port</label>
      <input id="start" type="number" value="1" />
    </div>
    <div class="col">
      <label>End Port</label>
      <input id="end" type="number" value="1024" />
    </div>
  </div>

  <label>Workers (threads)</label>
  <input id="workers" type="number" value="100" />

  <label>Timeout (seconds)</label>
  <input id="timeout" type="number" step="0.1" value="0.5" />

  <button id="scanBtn">Start Scan</button>

  <h3>Result</h3>
  <div id="result">
    <pre id="output">Idle</pre>
  </div>

  <script>
    document.getElementById('scanBtn').addEventListener('click', async () => {
      const host = document.getElementById('host').value.trim();
      const start = Number(document.getElementById('start').value);
      const end = Number(document.getElementById('end').value);
      const workers = Number(document.getElementById('workers').value);
      const timeout = Number(document.getElementById('timeout').value);

      if (!host) { alert('Enter host'); return; }
      if (start < 1 || end > 65535 || start > end) { alert('Invalid port range'); return; }

      const output = document.getElementById('output');
      output.textContent = 'Scanning... (this page will wait until scan finishes)';

      try {
        const resp = await fetch('/scan', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({host, start, end, workers, timeout})
        });
        const data = await resp.json();
        if (!resp.ok) {
          output.textContent = 'Error: ' + (data.error || JSON.stringify(data));
        } else {
          output.textContent = `Host: ${data.host}\nRange: ${data.start}-${data.end}\nOpen ports: ${data.open_ports.length ? data.open_ports.join(', ') : 'None'}\nTime: ${data.time_s.toFixed(2)}s`;
        }
      } catch (err) {
        output.textContent = 'Request failed: ' + err;
      }
    });
  </script>
</body>
</html>
